version: "2"

linters:
  default: none
  enable:
    # Bugs
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - staticcheck
    - unused

    # Security
    - gosec

    # Performance
    - prealloc
    - unconvert

    # Style
    - misspell
    - revive

    # Complexity
    - cyclop
    - funlen
    - gocognit

    # SQL / HTTP
    - bodyclose
    - sqlclosecheck

    # Architecture (ADR-0003: minimal client, never links server/store)
    - depguard

    # Dependency injection (docs/code.md: no hidden global state in business logic)
    - forbidigo

    # Tests
    - thelper
    - tparallel

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test files can be longer due to table-driven tests
      - path: "_test\\.go$"
        linters:
          - funlen
          - cyclop
          - gocognit
      # Test files: unused-parameter is common in mock implementations
      - path: "_test\\.go$"
        linters:
          - revive
        text: "unused-parameter"
      # Test files: file permissions, hardcoded credentials, and temp-path
      # writes (via t.TempDir/$HOME) are fine
      - path: "_test\\.go$"
        linters:
          - gosec
        text: "G(101|306|703)"
      # Test files: errcheck on w.Write/json.Encode in httptest handlers is noise
      - path: "_test\\.go$"
        linters:
          - errcheck
      # Package names that shadow stdlib are intentional for internal packages
      - path: "^internal/"
        linters:
          - revive
        text: "var-naming: avoid package names"
      # forbidigo seams: the clock package defines the wall clock; config and the
      # daemon (composition root) legitimately read env; tests use the real ones.
      - path: internal/clock/
        linters:
          - forbidigo
      - path: internal/config/
        linters:
          - forbidigo
        text: os\.Getenv
      - path: internal/daemon/
        linters:
          - forbidigo
        text: os\.Getenv
      - path: "_test\\.go$"
        linters:
          - forbidigo

  settings:
    # Import boundaries (docs/code.md, ADR-0003): the client packages ship in a
    # minimal binary and MUST NOT link the server, the store, or the web
    # dashboard. depguard makes that invariant a CI failure, not a review note.
    depguard:
      rules:
        client-minimal:
          list-mode: lax
          # Every client-side package, not the three that happened to be listed:
          # watch, usage, install, presence and localwatch ship in the same
          # minimal binary and were outside the barrier entirely (#515).
          files:
            - "**/internal/client/**"
            - "**/internal/report/**"
            - "**/internal/tui/**"
            - "**/internal/watch/**"
            - "**/internal/usage/**"
            - "**/internal/install/**"
            - "**/internal/presence/**"
            - "**/internal/localwatch/**"
            # …and the packages those import: api, apiclient, clock, compaction,
            # config, status, transcript and version all ship in the same binary.
            # #515 widened this list from three to eight and still left these
            # eight outside, which is why the list is no longer trusted:
            # TestDepguardCoversEveryClientPackage derives it from
            # `go list -deps ./cmd/vigie` and fails when one is missing (#556).
            - "**/internal/api/**"
            - "**/internal/apiclient/**"
            - "**/internal/clock/**"
            - "**/internal/compaction/**"
            - "**/internal/config/**"
            - "**/internal/status/**"
            - "**/internal/transcript/**"
            - "**/internal/version/**"
          deny:
            - pkg: github.com/haribo/claude-vigie/internal/server
              desc: client must not link the server (ADR-0003)
            - pkg: github.com/haribo/claude-vigie/internal/store
              desc: client must not link the store (ADR-0003)
            # internal/web, not web: the path was wrong, so this rule matched
            # nothing and the barrier it claims to enforce was not enforced (#515).
            - pkg: github.com/haribo/claude-vigie/internal/web
              desc: client must not link the web dashboard (ADR-0003)
            - pkg: github.com/prometheus/client_golang
              desc: metrics live in the daemon only (ADR-0003); the client never links prometheus

    # No hidden global state in business logic (docs/code.md): inject time, env,
    # and HTTP clients instead of reaching for the process globals. The seams are
    # excepted below (internal/clock defines the clock; config/daemon read env at
    # the composition edge; tests use the real ones freely).
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: inject a clock (func() time.Time, default clock.Now) — see docs/code.md
        - pattern: ^os\.Getenv$
          msg: read env through internal/config, not business logic — see docs/code.md
        - pattern: ^http\.DefaultClient$
          msg: use an injected *http.Client with a timeout — see docs/code.md

    cyclop:
      max-complexity: 15
      package-average: 10.0

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 30

    goimports:
      sections:
        - standard
        - default
        - localmodule

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      excludes:
        - G104  # Audit errors not checked (too noisy)
        - G115  # Integer overflow conversion (false positives for safe conversions)

    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

  exclude-dirs:
    - vendor
    - third_party
    - testdata
    - bin

  exclude-files:
    - ".*_gen\\.go$"

output:
  formats:
    text:
      print-linter-name: true
