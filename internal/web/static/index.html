<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="light dark"/>
  <title>claude-vigie</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%2338bdf8' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%2338bdf8'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--border-strong)" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="27" fill="none" stroke="var(--border-strong)" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="13" fill="none" stroke="var(--border-strong)" stroke-width="2.5"/>
          <g class="sweep">
            <path d="M50 50 L50 10 A40 40 0 0 1 82.4 69.6 Z" fill="var(--accent)" opacity="0.16"/>
            <line x1="50" y1="50" x2="50" y2="10" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
          </g>
          <circle cx="64.1" cy="23.5" r="4.5" fill="var(--waiting)"/>
          <circle cx="39.8" cy="28.3" r="3" fill="var(--working)"/>
          <circle cx="81.7" cy="55" r="3.2" fill="var(--idle)"/>
          <circle cx="33" cy="79.4" r="3" fill="var(--ended)"/>
          <circle cx="50" cy="50" r="4.5" fill="var(--accent)"/>
        </svg>
        <div class="wordmark">
          <b>claude<span>·</span>vigie</b>
          <small>vigie monitor</small>
        </div>
      </div>
      <div class="topbar-right">
        <span class="chip ver" id="ver" hidden></span>
        <span class="chip ro" title="The web client never writes into a session">read-only</span>
        <span class="chip conn" id="conn"><span class="dot"></span><span class="txt">connecting…</span></span>
        <button class="chip signout" id="signout" hidden title="Forget the token in this browser">sign out</button>
      </div>
    </header>

    <nav class="tabbar" id="tabbar"></nav>

    <!-- Outside #tab-sessions on purpose: that element is repainted whole
         whenever the fleet changes (#538), which would drop the caret and the
         text mid-keystroke. -->
    <div class="filterbar" id="filterbar" hidden>
      <input id="filter-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Filter — a name, machine, project, branch, status, or rc"
             aria-label="Filter sessions"/>
      <span class="filter-count" id="filter-count"></span>
      <label class="grouper"><span>group</span>
        <select id="group-select" aria-label="Group sessions"></select>
      </label>
    </div>

    <main id="tab-sessions"></main>
    <main id="tab-stats" hidden></main>
    <main id="tab-machines" hidden></main>
    <main id="tab-settings" hidden></main>
    <main id="view-detail" hidden></main>

    <div class="botbar" id="botbar" hidden></div>
  </div>

  <div class="gate" id="gate" hidden>
    <form class="gate-card" id="gate-form">
      <svg class="mark lg" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--border-strong)" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="27" fill="none" stroke="var(--border-strong)" stroke-width="2.5"/>
        <g class="sweep">
          <path d="M50 50 L50 10 A40 40 0 0 1 82.4 69.6 Z" fill="var(--accent)" opacity="0.16"/>
          <line x1="50" y1="50" x2="50" y2="10" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <circle cx="50" cy="50" r="4.5" fill="var(--accent)"/>
      </svg>
      <h1>claude·vigie</h1>
      <p>Paste your vigie token to view the sessions. It is stored in this browser only and sent as a bearer token to this server.</p>
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" placeholder="vigie token" aria-label="Vigie token"/>
      <div class="gate-err" id="gate-err" hidden>Invalid token — nothing was connected.</div>
      <button type="submit">Connect</button>
    </form>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
