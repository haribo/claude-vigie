name: Snapshot

# Manual, unversioned build of develop. Publishes a GitHub pre-release under a
# rolling `snapshot` tag (overwritten each run) with the binaries only —
# containerization and deployment are the deployer's concern, not ours.
# This is NOT a release: snapshots are mutable, unstable, and never SemVer.
# Versioned releases are cut separately from `main` (see docs/release.md).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: Build & publish snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Compute build stamp
        id: stamp
        run: echo "stamp=develop-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Gate: a snapshot must at least vet and pass tests.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/haribo/claude-vigie/internal/version.Version=${STAMP}"
          for arch in amd64 arm64; do
            for bin in vigie vigied; do
              GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
                go build -ldflags "$ldflags" -o "dist/${bin}-linux-${arch}-${STAMP}" "./cmd/${bin}"
            done
          done
          ls -l dist

      - name: Publish snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          set -euo pipefail
          # Roll the tag: remove the previous snapshot and its tag, then recreate.
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot \
            --target develop \
            --prerelease \
            --title "Snapshot ${STAMP}" \
            --notes "Unstable build of \`develop\` (\`${STAMP}\`). **Not a release** — mutable, overwritten on every snapshot run, not SemVer. See docs/release.md." \
            dist/*
