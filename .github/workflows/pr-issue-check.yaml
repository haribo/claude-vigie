name: PR issue reference

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [develop]

jobs:
  check-issue-ref:
    name: Check issue reference
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR references an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Allow trivial PRs (chore, style) to skip issue reference
          if echo "$PR_TITLE" | grep -qiE '^(chore|style)\b'; then
            echo "Trivial PR (chore/style) — issue reference not required."
            exit 0
          fi

          # Check for issue closing keywords in PR body
          # See: https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue
          if echo "$PR_BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#[0-9]+'; then
            echo "Issue reference found."
            exit 0
          fi

          echo "::error::PR must reference a GitHub issue in the body (e.g. 'Closes #12'). See docs/git-workflow.md for details."
          exit 1
