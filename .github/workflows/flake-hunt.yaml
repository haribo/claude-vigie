# Temporary: hammers the two tests of #476 on a runner, because neither
# reproduces on a developer machine. Removed in the same pull request once the
# diagnosis is in hand.
name: Flake hunt

on:
  push:
    branches: ['chore/476-flaky-tests']

permissions:
  contents: read

jobs:
  hunt:
    name: Hammer the flaky tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: the real CI condition — the whole suite, in parallel, six times
        continue-on-error: true
        run: |
          fail=0
          for i in $(seq 1 6); do
            echo "=== run $i ==="
            go test -race ./... 2>&1 | grep -E "^(---|FAIL|ok  .*(presence|store))" | grep -vE "^ok" || true
            go test -race ./... >/tmp/out-$i.txt 2>&1 || { fail=$((fail+1)); grep -E "^--- FAIL|_test.go:" /tmp/out-$i.txt | head -6; }
          done
          echo "runs failed: $fail/6"

