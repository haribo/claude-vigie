# Temporary: hammers the two tests of #476 on a runner, because neither
# reproduces on a developer machine. Removed in the same pull request once the
# diagnosis is in hand.
name: Flake hunt

on:
  push:
    branches: ['chore/476-flaky-tests']

permissions:
  contents: read

jobs:
  hunt:
    name: Hammer the flaky tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: presence — 200 runs
        continue-on-error: true
        run: |
          go test ./internal/presence/ -run '^TestWatcherRunning$' -race -count=200 2>&1 | tail -30

      - name: store — 20 runs
        continue-on-error: true
        run: |
          go test ./internal/store/ -run '^TestConcurrentWritesDoNotBusyError$' -race -count=20 2>&1 | tail -30

      - name: what else is called vigieprobe while the test runs
        continue-on-error: true
        run: |
          (for i in $(seq 1 400); do
             for d in /proc/[0-9]*; do
               c=$(cat "$d/comm" 2>/dev/null) || continue
               case "$c" in vigieprobe*) echo "$(basename "$d") $c $(tr '\0' ' ' < "$d/cmdline" 2>/dev/null)";; esac
             done
           done | sort | uniq -c | sort -rn | head -20) &
          sampler=$!
          go test ./internal/presence/ -run '^TestWatcherRunning$' -count=40 >/dev/null 2>&1 || true
          wait $sampler || true
