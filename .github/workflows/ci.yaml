name: CI

# Least privilege: the CI jobs only read the repo (the release workflows declare
# their own broader scopes). Overrides the token's default permissions (#252).
permissions:
  contents: read

on:
  # No paths-ignore: branch protection requires these checks, and a filtered-out
  # workflow never reports them, so a docs-only PR can never merge (#134). The Go
  # jobs are cheap and pass trivially when no code changed, so we always run them.
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "::error::Files need gofmt:"
            echo "$output"
            exit 1
          fi

      - name: Check goimports
        run: |
          output=$(goimports -l .)
          if [ -n "$output" ]; then
            echo "::error::Files need goimports:"
            echo "$output"
            exit 1
          fi

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.4

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Check go.mod is tidy
        run: go mod tidy -diff

  release-config:
    name: Release config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      # Validate .goreleaser.yaml and cross-compile the release binaries without
      # publishing, so a broken config or a build error is caught on the PR rather
      # than on the day of the tag (#252).
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A glob, not a hand-kept list: a new test file that nobody remembers to add
      # to both this job and `just code-test-js` is a test that never runs (#538).
      - name: JavaScript tests
        run: node --test test/js/*.test.mjs

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          # Set just under the tree's actual coverage, so a real regression trips it
          # rather than sliding under a floor left behind years ago. It was 55 while
          # the tree sat at 72.7 — seventeen points of coverage could vanish in
          # silence (#438). Raise it deliberately when coverage rises; the margin is
          # for ordinary fluctuation, not for erosion.
          #
          # The rule only holds if it is applied: 70 was left standing while the
          # tree climbed to 80.3, which is ten points of silent room — #438's own
          # failure, arriving through drift instead of neglect (#670). Raising it
          # is part of raising coverage, not a separate chore.
          floor=78.0
          echo "total coverage: ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { print "::error::coverage " t "% is below the " f "% floor — add tests or lower the floor deliberately"; exit 1 } }'

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
