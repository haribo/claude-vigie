name: Deploy site

# Publishes the static landing page (site/) to the host running Caddy.
# Decoupled from product releases: it fires only on site/** changes to develop,
# so a single site PR deploys on merge — no release, no second branch. This is
# NOT a required check (it carries a paths filter, unlike ci.yaml — see #134),
# and it no-ops when the deploy secrets are unset, so forks never fail on it.

on:
  push:
    branches: [develop]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rsync site over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::notice::deploy secrets unset — skipping (configure DEPLOY_* to enable)"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          echo "::notice::deployed site/ to ${DEPLOY_HOST}:${DEPLOY_PATH}"
