<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How Claude Vigie works">
  <style>
    .zone { fill: none; stroke: #d8cfc0; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .zlabel { fill: #857c70; font: 600 12px sans-serif; letter-spacing: .04em; text-transform: uppercase; }
    .node { fill: #ffffff; stroke: #211c18; stroke-width: 1.6; }
    .node.accent { stroke: #d9663f; stroke-width: 2; }
    .ntitle { fill: #211c18; font: 640 15px sans-serif; }
    .nsub { fill: #857c70; font: 500 12px ui-monospace, Menlo, Consolas, monospace; }
    .dblabel { fill: #211c18; font: 500 12px ui-monospace, Menlo, Consolas, monospace; }
    .flow { fill: none; stroke: #d9663f; stroke-width: 2.4; }
    .flow.dot { stroke-dasharray: 4 4; stroke-width: 1.8; }
    .elabel { fill: #211c18; font: 600 12px ui-monospace, Menlo, Consolas, monospace; }
    .elabel.m { fill: #857c70; font: 500 11px ui-monospace, Menlo, Consolas, monospace; }
    .radar { fill: none; stroke: #d9663f; }
    .db { fill: #ffffff; stroke: #211c18; stroke-width: 1.6; }
    .termdot { fill: #857c70; } .termdot.cor { fill: #d9663f; }
    .termline { stroke: #d8cfc0; stroke-width: 3; stroke-linecap: round; } .termline.on { stroke: #d9663f; }
    .ahfill { fill: #d9663f; } .wedge { fill: rgba(217,102,63,.14); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahfill" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="zone" x="34" y="66" width="312" height="316" rx="16"/>
  <text class="zlabel" x="50" y="56">on every machine running Claude Code</text>
  <rect class="node" x="70" y="92" width="240" height="60" rx="9"/>
  <text class="ntitle" x="190" y="128" text-anchor="middle">Claude Code session</text>
  <path class="flow" d="M160 152 C 152 178, 140 186, 132 208" marker-end="url(#ah)"/>
  <path class="flow" d="M220 152 C 228 178, 240 186, 248 208" marker-end="url(#ah)"/>
  <rect class="node" x="60" y="212" width="120" height="76" rx="9"/>
  <text class="ntitle" x="120" y="243" text-anchor="middle">hooks</text>
  <text class="nsub" x="120" y="264" text-anchor="middle">report</text>
  <rect class="node" x="200" y="212" width="120" height="76" rx="9"/>
  <text class="ntitle" x="260" y="243" text-anchor="middle">watcher</text>
  <text class="nsub" x="260" y="264" text-anchor="middle">watch</text>
  <text class="elabel m" x="190" y="322" text-anchor="middle">events + transcript scans</text>

  <path class="flow" d="M320 250 C 400 250, 400 196, 486 196" marker-end="url(#ah)"/>
  <text class="elabel" x="405" y="212" text-anchor="middle">POST /api/report</text>

  <rect class="zone" x="470" y="104" width="252" height="232" rx="16"/>
  <text class="zlabel" x="486" y="94">server host</text>
  <circle class="radar" cx="577" cy="188" r="78" stroke-width="1" opacity=".28"/>
  <circle class="radar" cx="577" cy="188" r="56" stroke-width="1" opacity=".34"/>
  <circle class="radar" cx="577" cy="188" r="34" stroke-width="1" opacity=".4"/>
  <path class="wedge" d="M577 188 L577 110 A78 78 0 0 1 640 224 Z"/>
  <rect class="node accent" x="497" y="156" width="160" height="66" rx="11"/>
  <text class="ntitle" x="577" y="194" text-anchor="middle">vigied</text>
  <path class="db" d="M547 278 v34 a30 9 0 0 0 60 0 v-34"/>
  <ellipse class="db" cx="577" cy="278" rx="30" ry="9"/>
  <text class="dblabel" x="577" y="303" text-anchor="middle">SQLite</text>
  <path class="flow dot" d="M577 222 L577 267" marker-end="url(#ah)"/>

  <path class="flow" d="M657 189 C 720 189, 720 208, 786 208" marker-end="url(#ah)"/>
  <text class="elabel" x="726" y="176" text-anchor="middle">SSE /api/events</text>

  <rect class="node" x="786" y="150" width="180" height="116" rx="10"/>
  <line x1="786" y1="176" x2="966" y2="176" stroke="#d8cfc0" stroke-width="1.4"/>
  <circle class="termdot cor" cx="801" cy="163" r="3.2"/>
  <circle class="termdot" cx="813" cy="163" r="3.2"/>
  <circle class="termdot" cx="825" cy="163" r="3.2"/>
  <text class="nsub" x="944" y="167" text-anchor="end">tui</text>
  <line class="termline on" x1="802" y1="196" x2="890" y2="196"/>
  <line class="termline" x1="802" y1="212" x2="950" y2="212"/>
  <line class="termline" x1="802" y1="228" x2="928" y2="228"/>
  <line class="termline" x1="802" y1="244" x2="946" y2="244"/>
  <text class="ntitle" x="876" y="292" text-anchor="middle">vigie tui</text>
</svg>
