version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: claude-fleet
    main: ./cmd/claude-fleet
    binary: claude-fleet
    # CGO disabled: the whole toolchain stays pure Go so binaries
    # cross-compile cleanly and link statically (see ADR-0002).
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/haribo/claude-fleet/internal/version.Version={{ .Version }}
      - -X github.com/haribo/claude-fleet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/haribo/claude-fleet/internal/version.BuildTime={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug fixes
      regexp: "^fix"
      order: 1
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto
