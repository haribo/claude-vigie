version: 2

before:
  hooks:
    - go mod tidy

builds:
  # claude-fleet — the client (init, report, tui), installed on every machine.
  - id: claude-fleet
    main: ./cmd/claude-fleet
    binary: claude-fleet
    # CGO disabled: the whole toolchain stays pure Go so binaries
    # cross-compile cleanly and link statically (see ADR-0002).
    env:
      - CGO_ENABLED=0
    # Linux-only releases for now: presence detection reads /proc (ADR-0006), so
    # darwin/windows binaries are not shipped or supported yet.
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/haribo/claude-fleet/internal/version.Version={{ .Version }}
      - -X github.com/haribo/claude-fleet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/haribo/claude-fleet/internal/version.BuildTime={{ .Date }}

  # claude-fleetd — the server daemon (serve), runs on the host machine.
  - id: claude-fleetd
    main: ./cmd/claude-fleetd
    binary: claude-fleetd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/haribo/claude-fleet/internal/version.Version={{ .Version }}
      - -X github.com/haribo/claude-fleet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/haribo/claude-fleet/internal/version.BuildTime={{ .Date }}

archives:
  # Separate archives so client machines download only claude-fleet.
  - id: client
    ids: [claude-fleet]
    formats: [tar.gz]
    name_template: "claude-fleet_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: daemon
    ids: [claude-fleetd]
    formats: [tar.gz]
    name_template: "claude-fleetd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug fixes
      regexp: "^fix"
      order: 1
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto
