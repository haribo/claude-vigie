version: 2

before:
  hooks:
    - go mod tidy

builds:
  # vigie — the client (init, report, tui), installed on every machine.
  - id: vigie
    main: ./cmd/vigie
    binary: vigie
    # CGO disabled: the whole toolchain stays pure Go so binaries
    # cross-compile cleanly and link statically (see ADR-0002).
    env:
      - CGO_ENABLED=0
    # Linux-only releases for now: presence detection reads /proc (ADR-0006), so
    # darwin/windows binaries are not shipped or supported yet.
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/haribo/claude-vigie/internal/version.Version={{ .Version }}
      - -X github.com/haribo/claude-vigie/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/haribo/claude-vigie/internal/version.BuildTime={{ .Date }}

  # vigied — the server daemon (serve), runs on the host machine.
  - id: vigied
    main: ./cmd/vigied
    binary: vigied
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/haribo/claude-vigie/internal/version.Version={{ .Version }}
      - -X github.com/haribo/claude-vigie/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/haribo/claude-vigie/internal/version.BuildTime={{ .Date }}

archives:
  # Separate archives so client machines download only vigie.
  - id: client
    ids: [vigie]
    formats: [tar.gz]
    name_template: "vigie_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: daemon
    ids: [vigied]
    formats: [tar.gz]
    name_template: "vigied_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# The release body is set from CHANGELOG.md — the single source of truth (#312).
# goreleaser must not generate its own commit-dump changelog (the Keep a Changelog
# anti-pattern); the /release skill mirrors the version's CHANGELOG section into
# the GitHub Release notes.
changelog:
  disable: true

release:
  draft: false
  prerelease: auto
