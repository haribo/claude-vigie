<g class="after"><rect x="712.0" y="202" width="21.6" height="16" fill="#e2e8f0"/><text xml:space="preserve" x="28.0" y="214.0" class="m"><tspan fill="#0284c7" class="b">Sessions</tspan><tspan fill="#94a3b8">   Stats   Machines   Settings                                                         </tspan><tspan fill="#0f172a"> i </tspan><tspan fill="#16a34a"> ●</tspan></text><text xml:space="preserve" x="28.0" y="232.0" class="m"><tspan fill="#0284c7">━━━━━━━━</tspan><tspan fill="#e2e8f0">────────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text xml:space="preserve" x="28.0" y="250.0" class="m"><tspan fill="#94a3b8" class="b">  NAME                    DIR               STATUS        DETAIL</tspan></text><text xml:space="preserve" x="28.0" y="268.0" class="m"><tspan fill="#e2e8f0">────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text xml:space="preserve" x="28.0" y="286.0" class="m"><tspan fill="#0284c7">▎ </tspan><tspan fill="#16a34a">api-gateway           </tspan><tspan fill="#0f172a">  api-gateway       </tspan><tspan fill="#16a34a">●</tspan><tspan fill="#16a34a"> working   </tspan><tspan fill="#0f172a">  </tspan><tspan fill="#94a3b8">Edit internal/router.go</tspan></text><text xml:space="preserve" x="28.0" y="304.0" class="m"><tspan fill="#0284c7">  </tspan><tspan fill="#2563eb">web-app               </tspan><tspan fill="#0f172a">  web-app           </tspan><tspan fill="#2563eb" class="blink">●</tspan><tspan fill="#2563eb"> idle      </tspan><tspan fill="#0f172a">  </tspan><tspan fill="#2563eb">analysis done — 3 entry points</tspan></text><text xml:space="preserve" x="28.0" y="322.0" class="m"><tspan fill="#0284c7">  </tspan><tspan fill="#b45309">data-pipeline         </tspan><tspan fill="#0f172a">  data-pipeline     </tspan><tspan fill="#b45309">●</tspan><tspan fill="#b45309"> waiting   </tspan><tspan fill="#0f172a">  </tspan><tspan fill="#94a3b8">Bash: git push --force ?</tspan></text><text xml:space="preserve" x="28.0" y="340.0" class="m"><tspan fill="#e2e8f0">────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text><rect x="690.4" y="346" width="21.6" height="16" fill="#e2e8f0"/><text xml:space="preserve" x="28.0" y="358.0" class="m"><tspan fill="#94a3b8">usage 5h ▓▓░░░░░░░░ 28%(4h)  7d ▓▓▓▓▓▓░░░░ 69%(2d)                       sort last seen▼ · </tspan><tspan fill="#0f172a"> h </tspan><tspan fill="#94a3b8"> help</tspan></text></g>
