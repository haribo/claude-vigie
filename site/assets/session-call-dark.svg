<rect x="16" y="16" width="788" height="150" rx="10" fill="#111c2e" stroke="#1e293b"/>
<circle cx="36" cy="34" r="4" fill="#334155"/>
<circle cx="50" cy="34" r="4" fill="#334155"/>
<circle cx="64" cy="34" r="4" fill="#334155"/>
<text xml:space="preserve" x="86.0" y="38.0" class="m"><tspan fill="#64748b">claude — ~/web-app</tspan></text>
<line x1="16" y1="50" x2="804" y2="50" stroke="#1e293b"/>
<clipPath id="c1-dark"><rect class="tw1" x="46" y="60" width="0" height="16"/></clipPath>
<text xml:space="preserve" x="30.0" y="72.0" class="m"><tspan fill="#38bdf8">&gt; </tspan></text>
<g class="type1"><g clip-path="url(#c1-dark)"><text xml:space="preserve" x="46.0" y="72.0" class="m"><tspan fill="#e2e8f0">analyse the project and tell me the entry points.</tspan></text></g></g>
<clipPath id="c2-dark"><rect class="tw2" x="46" y="78.0" width="0" height="16"/></clipPath>
<g class="type2"><g clip-path="url(#c2-dark)"><text xml:space="preserve" x="46.0" y="90.0" class="m"><tspan fill="#e2e8f0" class="b">when you're finished, tell me in vigie</tspan></text></g></g>
<rect class="cur" x="319.6" y="79.0" width="7" height="14"/>
<g class="phase2"><text xml:space="preserve" x="30.0" y="114.0" class="m"><tspan fill="#64748b">⏵ Analysing project structure…</tspan></text></g>
<g class="phase3"><text xml:space="preserve" x="30.0" y="114.0" class="m"><tspan fill="#4ade80">✓ Done — 3 entry points</tspan></text><text xml:space="preserve" x="46.0" y="132.0" class="m"><tspan fill="#64748b">↳ vigie call "analysis done — 3 entry points"</tspan></text></g>
